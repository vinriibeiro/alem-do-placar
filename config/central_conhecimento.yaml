    titulo: Como esta central funciona
    perguntas: ["Como funciona esta central?", "Você usa inteligência artificial?", "As respostas são inventadas?"]
    palavras: [central, consulta, funciona, inteligencia, artificial, ia, chatgpt, inventadas, respostas]
    resposta: >
      A central não usa inteligência artificial paga. Ela procura sua pergunta em uma base de conhecimento
      escrita a partir da documentação do projeto e calcula as estatísticas diretamente das {n_partidas}
      partidas, no seu navegador. Se a pergunta estiver fora do tema ou sem dados suficientes, ela avisa em vez
      de inventar.
