name: Publicar site (GitHub Pages)

# Publica o site estático (início, dashboard, Central de Consulta e metodologia).
# Só roda quando acionado manualmente: a publicação é sempre uma decisão do responsável.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: python -m pip install -e ".[test]"

      - name: Testar (inclui o motor da Central em Node)
        run: python -B -m pytest

      - name: Gerar site
        run: >
          python scripts/build_site.py
          --powerbi-url "${{ vars.POWERBI_EMBED_URL }}"
          --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
