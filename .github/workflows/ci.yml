name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -e ".[test,lint]"

      - name: Lint
        run: python -m ruff check .

      - name: Formatação
        run: python -m ruff format --check .

      - name: Testes
        run: python -B -m pytest
