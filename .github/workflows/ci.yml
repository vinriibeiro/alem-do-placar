name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: python -m pip install -e ".[test,lint]"

      - name: Lint
        run: python -m ruff check .

      - name: Formatação
        run: python -m ruff format --check .

      - name: Testes
        run: python -B -m pytest

  imagem:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t alem-do-placar:ci .

      - name: Testar a imagem
        run: |
          docker run -d --name app -p 8000:8000 -e ALLOWED_HOSTS=localhost alem-do-placar:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/contexto | grep -q '"partidas"'
          curl -fsS http://127.0.0.1:8000/ | grep -q "Além do Placar"
          docker logs app
