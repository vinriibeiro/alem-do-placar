[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alem-do-placar"
version = "0.1.0"
description = "Plataforma analítica de inteligência esportiva (futebol) — Além do Placar."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vinícius Ribeiro" }]
# Dependências de execução do pipeline (T003). Demais bibliotecas entram nas tarefas seguintes.
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
lint = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Evita a criação de .pytest_cache dentro do projeto.
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
